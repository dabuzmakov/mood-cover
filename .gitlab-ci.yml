image: mcr.microsoft.com/dotnet/sdk:10.0

stages:
  - build
  - validate
  - test
  - integration

build:
  stage: build
  script:
    - dotnet build
  only:
    - merge_requests
    - master

linter:
  stage: validate
  script:
    - dotnet format --verify-no-changes
  only:
    - merge_requests
    - master

# Юнит-тесты доменной логики (MoodCover.Tests) вызывают классы приложения
# напрямую, без запуска исполняемого файла.
unit_test:
  stage: test
  needs:
    - job: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "master"
      when: always
      allow_failure: false
    - when: never
  script:
    - dotnet test src/MoodCover.Tests/MoodCover.Tests.csproj

# Интеграционные тесты (MoodCover.IntegrationTests) собирают приложение и
# запускают готовый исполняемый файл отдельным процессом (CliRunner), проверяя
# реальное поведение CLI: код возврата, вывод и созданные PNG/отчёты.
# Выделены в отдельный шаг пайплайна, чтобы не смешиваться с юнит-тестами.
integration_test:
  stage: integration
  needs:
    - job: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "master"
      when: always
      allow_failure: false
    - when: never
  script:
    - dotnet test src/MoodCover.IntegrationTests/MoodCover.IntegrationTests.csproj